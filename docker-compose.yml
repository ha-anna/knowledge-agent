services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - .:/workspaces/knowledge-agent

    working_dir: /workspaces/knowledge-agent

    command: sleep infinity

    ports:
      - "8000:8000"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
